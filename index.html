<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0B5A0F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="FieldSheet">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>FieldSheet</title>
<style>
:root{--paper:#F6F7F4;--ink:#111512;--ink2:#5B655C;--rule:#CFD6D0;--strip:#EAEFEA;--green:#0B5A0F;--green2:#E3EFE4;--hi:#FFF2B3;--yel:#E8C21E}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;font-size:15px;line-height:1.35;min-height:100vh}
button{font:inherit;cursor:pointer}
.top{background:var(--green);color:#fff;padding:calc(env(safe-area-inset-top) + 12px) 16px 12px;display:flex;align-items:center;justify-content:space-between}
.top b{font-size:16px;letter-spacing:.01em}.top .lg{background:#fff;color:#111;border-radius:3px;padding:1px 6px;margin-right:8px;font-weight:800;letter-spacing:-.02em}
.top button{background:none;border:1px solid rgba(255,255,255,.4);color:#fff;border-radius:99px;padding:5px 12px;font-size:13px}
.wrap{max-width:720px;margin:0 auto;padding:0 16px 60px}
/* home */
.home{padding-top:28px}
.home h1{font-size:26px;font-weight:700;margin:0 0 6px;letter-spacing:-.3px}
.home p{color:var(--ink2);margin:0 0 22px;max-width:44ch}
.big{display:block;width:100%;padding:16px;border-radius:10px;border:0;background:var(--green);color:#fff;font-size:17px;font-weight:600;margin-bottom:10px}
.sec{display:block;width:100%;padding:13px;border-radius:10px;border:1.5px solid var(--ink);background:#fff;color:var(--ink);font-size:15px;margin-bottom:10px}
details{margin-top:18px;border-top:1px solid var(--rule);padding-top:12px}
summary{cursor:pointer;color:var(--ink2);font-size:14px}
textarea{width:100%;min-height:110px;font:13px/1.4 ui-monospace,Menlo,monospace;border:1.5px solid var(--rule);border-radius:8px;padding:8px;margin:10px 0 8px;background:#fff}
.err{background:#FBE9E7;border:1px solid #E5A79F;color:#7A1F14;border-radius:8px;padding:10px 12px;margin:12px 0;font-size:14px;display:none}
.install{background:#fff;border:1.5px solid var(--rule);border-radius:10px;padding:12px;font-size:13.5px;color:var(--ink2);margin-top:18px}
.install b{color:var(--ink)}
/* scanner */
.scan{position:fixed;inset:0;background:#000;z-index:20;display:none;flex-direction:column}
.scan video{flex:1;width:100%;object-fit:cover}
.scan .bar{padding:14px 16px calc(env(safe-area-inset-bottom) + 14px);display:flex;justify-content:space-between;align-items:center;color:#fff;background:#000}
.scan .bar button{background:#fff;color:#000;border:0;border-radius:99px;padding:9px 14px;font-weight:600;font-size:14px}
.reticle{position:absolute;left:50%;top:45%;width:min(70vw,320px);aspect-ratio:1;transform:translate(-50%,-50%);border:2px solid rgba(255,255,255,.85);border-radius:14px;pointer-events:none}
/* record */
.hd{padding:18px 0 12px;border-bottom:3px solid var(--green)}
.hd .u{font-size:38px;font-weight:700;letter-spacing:-1px;line-height:1.05}
.hd .t{font-size:17px;font-weight:600;margin-top:2px}
.hd .m{color:var(--ink2);font-size:13px;margin-top:6px}
.hd .m b{color:var(--ink);font-weight:600}
.warn{font-size:12.5px;color:#7A5300;background:var(--hi);border-radius:6px;padding:6px 10px;margin-top:10px;display:inline-block}
.search{position:sticky;top:0;z-index:5;background:var(--paper);padding:10px 0;border-bottom:1px solid var(--rule)}
.search input{width:100%;font:inherit;font-size:17px;padding:10px 12px;border:1.5px solid var(--ink);border-radius:8px;background:#fff;color:var(--ink)}
.search input:focus{outline:3px solid #9CC79F;outline-offset:0}
.hint{font-size:12px;color:var(--ink2);margin-top:5px;min-height:15px}
h2{font-size:13px;font-weight:600;color:var(--ink2);margin:22px 0 10px}
h2 span{color:var(--ink);font-size:18px;font-weight:700;display:block}
.ctl{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ctl>div{border:1.5px solid var(--ink);border-radius:8px;background:#fff;padding:10px 12px}
.ctl .tag{font-weight:700;font-size:17px}
.ctl .mdl{color:var(--green);font-weight:700;font-size:13px}
.ctl dl{margin:8px 0 0;display:grid;grid-template-columns:auto 1fr;gap:2px 10px;font-size:13px}
.ctl dt{color:var(--ink2)}.ctl dd{margin:0;font-weight:600}
.ctl dd.na{color:var(--ink2);font-weight:400;font-style:italic}
.dev{border:1.5px solid var(--ink);border-radius:8px;background:#fff;margin:0 0 14px;overflow:hidden}
.dev .h{display:flex;justify-content:space-between;align-items:baseline;padding:10px 12px;border-bottom:1.5px solid var(--ink)}
.dev .h .tag{font-weight:700;font-size:17px}
.dev .h .mdl{color:var(--ink2);font-size:13px}
.dev .h .mdl b{color:var(--green)}
.grp{padding:5px 12px;font-size:12px;color:var(--green);font-weight:600;background:var(--green2);border-bottom:1px solid var(--rule)}
.pt{display:grid;grid-template-columns:54px 1fr auto;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--rule)}
.pt:last-child{border-bottom:0}
.pt .ch{font-weight:700;font-size:13px;background:var(--strip);border-radius:3px;padding:3px 0;text-align:center;border:1px solid var(--rule)}
.pt .n{font-weight:500;line-height:1.2}
.pt .n small{display:block;color:var(--ink2);font-size:12px;margin-top:2px}
.pt .r{text-align:right;font-size:12.5px;line-height:1.3}
.pt .r b{display:block;font-size:14px}
.pt{cursor:pointer}
.pt .r{text-align:right;font-size:12.5px;line-height:1.3;color:var(--ink2);max-width:120px}.pt .r b{display:block;font-size:14px;color:var(--ink)}
.sheet{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.45);display:none;align-items:flex-end;justify-content:center}
.sheet.on{display:flex}
.sheet .pn{background:#fff;width:100%;max-width:720px;max-height:92vh;overflow:auto;border-radius:16px 16px 0 0;padding:14px 16px calc(env(safe-area-inset-bottom) + 20px)}
.sheet .grab{width:40px;height:4px;border-radius:2px;background:var(--rule);margin:0 auto 12px}
.sheet h3{margin:0;font-size:20px}.sheet .sub{color:var(--ink2);font-size:13px;margin:2px 0 10px}
.sheet svg{width:100%;height:auto;display:block;margin:6px 0 10px}
.wl{display:grid;grid-template-columns:auto 1fr;gap:5px 10px;font-size:14px;align-items:center;margin-bottom:10px}
.wl .sc{font-weight:700;background:var(--strip);border:1px solid var(--rule);border-radius:3px;padding:2px 7px;white-space:nowrap}
.wl .ld b{font-weight:600}.wl .ld small{display:block;color:var(--ink2);font-size:12px}
.dry{font-size:13.5px;background:#FFF2B3;border-left:3px solid #C99A00;padding:8px 10px;border-radius:0 6px 6px 0;line-height:1.4;margin-bottom:10px}
.dry>b:first-child{display:block;margin-bottom:2px}
.tip{font-size:13.5px;color:var(--ink2);line-height:1.4;margin-bottom:8px}
.close{display:block;width:100%;padding:12px;border:1.5px solid var(--ink);border-radius:10px;background:#fff;color:var(--ink);font-size:15px;margin-top:6px}
.hit{background:var(--hi)!important;box-shadow:inset 0 0 0 2px var(--yel)}
.dim{opacity:.25}
.foot{margin-top:28px;font-size:12px;color:var(--ink2);text-align:center}
@media(min-width:640px){.ctl{grid-template-columns:repeat(3,1fr)}}
</style>
</head>
<body>
<div class="top"><b><span class="lg">es2</span> FieldSheet</b><button id="home" hidden>Scan another</button></div>

<div class="wrap" id="app"></div>

<div class="sheet" id="sheet"><div class="pn" id="pn"></div></div>
<div class="scan" id="scan"><video id="vid" playsinline muted></video><div class="reticle"></div>
<div class="bar"><span id="scanmsg">Point at a tag</span><span><button id="takepic" style="margin-right:8px">Take photo</button><button id="stop">Cancel</button></span></div></div>
<input type="file" id="pic" accept="image/*" capture="environment" hidden>

<script src="jsqr.js"></script>
<script>
// ---------- sample tag (AHU-34, sheet 1.11) ----------
const SAMPLE={"v":1,"unit":"AHU-34","typ":"CAV AHU","job":"03-24018B","sh":["1.10","1.11","1.12"],"rev":"3","asb":null,"ctl":[{"tag":"ALC-34","mdl":"OFBBC-NR","role":"bc","di":null,"mac":"A","net":"ARCNET","ip":null},{"tag":"ALC-35","mdl":"FIO812u","role":"exp","exp":1},{"tag":"ALC-36","mdl":"FIO812u","role":"exp","exp":2}],"pts":[["ALC-35","UI-01","Space Temp","TH","C-101",["T3","T4"]],["ALC-35","UI-02","Space Pressure","mA","C-102",["T6","T5"]],["ALC-35","UI-05","Supply Air Temp","TH","C-105",["T11","T12"]],["ALC-35","UI-06","Return Air Temp","TH","C-106",["T13","T14"]],["ALC-35","UI-07","Return Air Hum","mA","C-107",["T16","T15"]],["ALC-35","UI-09","Mixed Air Temp","TH","C-109",["T19","T20"]],["ALC-35","UI-11","Filters Diff Pressure","VI","C-111",["T23","T24"]],["ALC-35","UI-12","Leaving Coil Temp","TH","C-112",["T25","T26"]],["ALC-35","UO-01","CHW Valve","VO","C-121",["T29","T30"]],["ALC-35","UO-02","Gas Valve Enable","DO","C-122",["T27 (24V)","CR-34 coil"]],["ALC-35","UO-03","Gas Valve Signal","VO","C-123",["T33","T34"]],["ALC-35","UO-04","Economizer Dampers","VO","C-124",["T35","T36"]],["ALC-35","UO-05","Exhaust Air Damper","VO","C-125",["T37","T38"]],["ALC-36","UI-01","Supply Fan Status","DI","C-201",["T41","T42"]],["ALC-36","UI-02","Supply Fan VFD Fault","DI","C-202",["T43","T44"]],["ALC-36","UI-05","Exhaust Fan Status","DI","C-205",["T49","T50"]],["ALC-36","UI-06","Exhaust Fan VFD Fault","DI","C-206",["T51","T52"]],["ALC-36","UO-01","Supply Fan Start/Stop","DO","C-221",["T65 (24V)","CR-27 coil"]],["ALC-36","UO-02","Supply Fan Speed","VO","C-222",["T69","T70"]],["ALC-36","UO-03","Exhaust Fan Start/Stop","DO","C-223",["T65 (24V)","CR-28 coil"]],["ALC-36","UO-04","Exhaust Fan Speed","VO","C-224",["T73","T74"]]]};

const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const TYPES={TH:'thermistor',mA:'4–20 mA (2-wire)',VI:'0–5/10 V input',VO:'0–10 V output',DI:'dry contact in',DO:'dry contact out',DON:'relay NO',RNET:'Rnet sensor',PWR:'24 VAC power'};
// Wiring templates — the app's codebook. screws: [label, role, caption]. Land terminals map positionally. No wire colors: field colors vary.
const TPL={
 TH:{screws:[['+','sig','signal'],['−','ret','return']],tip:'Two-wire thermistor. Polarity is not electrically critical, but land per drawing so every strip reads the same.'},
 VI:{screws:[['+','sig','signal'],['−','ret','common']],tip:'Signal on +, device common on −. If the device needs power, feed it from 24 Vdc per the drawing — not from the input.'},
 mA:{screws:[['24Vdc +','pwr','loop power out'],['+','sig','loop return in']],tip:'2-wire loop: 24 Vdc + feeds the device, the device return lands on the input +. The input − screw is NOT used.',fixed:[true,false]},
 DI:{screws:[['+','sig','contact'],['−','ret','contact']],tip:'Dry contact from the device. The controller supplies the sensing voltage — do NOT bring any external voltage to these screws.'},
 VO:{screws:[['+','sig','0–10 V signal'],['−','ret','common']],tip:'Analog output: + carries the signal, − is the reference to the device common. Both are needed.'},
 DO:{screws:[['+','feed','supply IN'],['−','sw','switched OUT to load']],dry:'Bring supply in on +; − switches it out to the load.'},
 DON:{screws:[['NO','sw','switched OUT to load']],dry:'Normally-open contact. The contact common must be fed from the load\'s supply — see the unit\'s R/C terminals.'},
 RNET:{screws:[['Gnd','net','ground'],['Rnet+','net','data +'],['Rnet−','net','data −'],['+12V','net','sensor power']],tip:'Four-conductor Rnet to the ZS sensor. All four wires land at the sensor; match the screw labels on both ends.',single:true},
 PWR:{screws:[['24 Vac','pwr','hot'],['Gnd','ret','common']],tip:'Controller power. Ground screw to the same common as the transformer / unit secondary; do not tie to earth.'}};
const ROLES={bc:'Building controller',exp:'I/O expander',zn:'Zone controller'};

// ---------- payload decode ----------
async function decodePayload(str){
  str=str.trim();
  const h=str.indexOf('#'); if(h>=0) str=str.slice(h+1);
  if(str.startsWith('j')) return JSON.parse(str.slice(1));
  if(str.startsWith('z')){
    if(!('DecompressionStream' in window)) throw new Error('This browser cannot inflate compressed tags. Update iOS/Android or use an uncompressed tag.');
    let b64=str.slice(1).replace(/-/g,'+').replace(/_/g,'/'); while(b64.length%4) b64+='=';
    const bytes=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));
    const ds=new DecompressionStream('deflate');
    const w=ds.writable.getWriter(); w.write(bytes); w.close();
    const txt=await new Response(ds.readable).text();
    return JSON.parse(txt);
  }
  if(str.startsWith('{')) return JSON.parse(str);   // pasted raw JSON
  throw new Error('Not an ES2 tag.');
}

// ---------- home ----------
function home(){
  $('#home').hidden=true; location.hash='';
  $('#app').innerHTML=`<div class="home">
  <h1>Scan an equipment tag</h1>
  <p>Wiring and network reference for the unit you're standing at. Works offline once this page has loaded.</p>
  <button class="big" id="b-scan">Scan tag</button>
  <button class="sec" id="b-pic">Take a photo of a tag</button>
  <button class="sec" id="b-sample">Open sample tag (AHU-34)</button>
  <div class="err" id="err"></div>
  <details><summary>Paste a tag payload or JSON</summary>
   <textarea id="paste" placeholder="Paste the full tag URL, the part after #, or the raw JSON"></textarea>
   <button class="sec" id="b-paste">Open</button></details>
  <div class="install"><b>Install:</b> iPhone — Share → Add to Home Screen. Android — menu → Install app. After that the stock camera opens tags here, offline.</div>
  </div>`;
  $('#b-scan').onclick=startScan;
  $('#b-sample').onclick=()=>show(SAMPLE);
  $('#b-pic').onclick=()=>$('#pic').click();
  $('#b-paste').onclick=async()=>{try{show(await decodePayload($('#paste').value))}catch(e){err(e.message)}};
}
function err(m){const e=$('#err');if(e){e.textContent=m;e.style.display='block'}else alert(m)}
function errSafe(m){if(!$('#err'))home();err(m)}

// ---------- scanner ----------
let stream,raf,frames=0;
function decodeImageData(img){const q=jsQR(img.data,img.width,img.height,{inversionAttempts:'attemptBoth'});return q?q.data:null}
async function startScan(){
  const sc=$('#scan'),v=$('#vid'),msg=$('#scanmsg');
  sc.style.display='flex'; msg.textContent='Starting camera…'; frames=0;
  try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:960}},audio:false});}
  catch(e){msg.textContent='Camera blocked: '+e.name+'. Use "Take photo" below.';return}
  v.srcObject=stream; v.setAttribute('autoplay',''); v.setAttribute('playsinline',''); v.muted=true;
  try{await v.play()}catch(e){msg.textContent='Preview failed: '+e.name+'. Use "Take photo" below.';return}
  const det=('BarcodeDetector' in window)?new BarcodeDetector({formats:['qr_code']}):null;
  const cv=document.createElement('canvas'),cx=cv.getContext('2d',{willReadFrequently:true});
  let busy=false;
  const loop=async()=>{
    if(!stream) return;
    if(!busy&&v.readyState>=2&&v.videoWidth){busy=true;frames++;let text=null;
      if(det){try{const r=await det.detect(v);if(r&&r[0])text=r[0].rawValue}catch{}}
      if(!text){const s=Math.min(1,800/Math.max(v.videoWidth,v.videoHeight));cv.width=v.videoWidth*s|0;cv.height=v.videoHeight*s|0;cx.drawImage(v,0,0,cv.width,cv.height);text=decodeImageData(cx.getImageData(0,0,cv.width,cv.height))}
      if(text){msg.textContent='Reading…';try{const rec=await decodePayload(text);stopScan();show(rec);return}catch(e){msg.textContent=e.message}}
      else if(frames%15===0)msg.textContent=`Point at a tag (${frames} frames)`;
      busy=false}
    raf=requestAnimationFrame(loop);
  };
  loop();
}
function stopScan(){cancelAnimationFrame(raf);if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}const v=$('#vid');v.pause();v.srcObject=null;$('#scan').style.display='none'}
$('#stop').onclick=stopScan;
// photo fallback — uses the phone's own camera app, no getUserMedia needed
$('#pic').addEventListener('change',async e=>{const f=e.target.files[0];if(!f)return;e.target.value='';
  try{const bmp=await createImageBitmap(f);const s=Math.min(1,1600/Math.max(bmp.width,bmp.height));const cv=document.createElement('canvas');cv.width=bmp.width*s|0;cv.height=bmp.height*s|0;const cx=cv.getContext('2d');cx.drawImage(bmp,0,0,cv.width,cv.height);
    let text=decodeImageData(cx.getImageData(0,0,cv.width,cv.height));
    if(!text){const cv2=document.createElement('canvas');cv2.width=cv.width/2|0;cv2.height=cv.height/2|0;cv2.getContext('2d').drawImage(cv,0,0,cv2.width,cv2.height);text=decodeImageData(cv2.getContext('2d').getImageData(0,0,cv2.width,cv2.height))}
    if(!text)throw new Error('No QR code found in that photo. Fill the frame with the code and try again.');
    stopScan();show(await decodePayload(text))}
  catch(ex){stopScan();errSafe(ex.message)}});
$('#takepic').onclick=()=>$('#pic').click();

// ---------- render ----------
function show(r){
  $('#home').hidden=false;
  const ctlBy=Object.fromEntries((r.ctl||[]).map(c=>[c.tag,c]));
  const byCtl={}; (r.pts||[]).forEach(p=>(byCtl[p[0]]??=[]).push(p));
  const ctls=(r.ctl||[]).map(c=>{
    const rows=[];
    if(c.role) rows.push(['Role',ROLES[c.role]||c.role]);
    if('di' in c) rows.push(['Device instance',c.di]);
    if('mac' in c) rows.push(['MAC',c.mac]);
    if(c.net) rows.push(['Network',c.net]);
    if('ip' in c) rows.push(['IP',c.ip]);
    if(c.exp!=null) rows.push(['Expander ID',c.exp]);
    return `<div class="s" data-k="${esc(c.tag+' '+c.mdl+' '+(c.di??'')+' '+(c.mac??'')+' '+(c.ip??''))}"><div class="tag">${esc(c.tag)}</div><div class="mdl">${esc(c.mdl)}</div>
      <dl>${rows.map(([k,v])=>`<dt>${k}</dt><dd class="${v==null||v===''?'na':''}">${v==null||v===''?'not set':esc(v)}</dd>`).join('')}</dl></div>`}).join('');
  const devs=Object.entries(byCtl).map(([tag,pts])=>{
    const c=ctlBy[tag]||{};
    const row=(p,i)=>{const lands=Array.isArray(p[5])?p[5]:[];const key=[p[0],p[1],p[2],p[3],p[4],p[6],...lands,TYPES[p[3]]||''].filter(Boolean).join(' ');
      return `<div class="pt s" data-k="${esc(key)}" data-i="${i}"><span class="ch">${esc(p[1])}</span><span class="n">${esc(p[2])}<small>${esc(TYPES[p[3]]||p[3])}${p[4]?' · '+esc(p[4]):''}${p[6]?' · '+esc(p[6]):''}</small></span><span class="r"><b>${esc(lands.join(' / ')||'at ctlr')}</b>tap for wiring</span></div>`};
    const idx=p=>(r.pts||[]).indexOf(p);const R=p=>row(p,idx(p));const ui=pts.filter(p=>/^(UI|IN|AI|BI|Rnet)/i.test(p[1])),uo=pts.filter(p=>/^(UO|DO|AO|BO)/i.test(p[1])),other=pts.filter(p=>!ui.includes(p)&&!uo.includes(p));
    return `<div class="dev"><div class="h"><span class="tag">${esc(tag)}</span><span class="mdl"><b>${esc(c.mdl||'')}</b>${c.exp!=null?' · Expander '+c.exp:''}</span></div>
      ${ui.length?'<div class="grp">Inputs</div>'+ui.map(R).join(''):''}${uo.length?'<div class="grp">Outputs</div>'+uo.map(R).join(''):''}${other.length?'<div class="grp">Points</div>'+other.map(R).join(''):''}</div>`}).join('');
  $('#app').innerHTML=`
  <div class="hd"><div class="u">${esc(r.unit)}</div><div class="t">${esc(r.typ||'')}</div>
   <div class="m">Job <b>${esc(r.job||'—')}</b> · sheets <b>${esc((r.sh||[]).join(', '))}</b> · rev <b>${esc(r.rev||'—')}</b></div>
   ${r.asb?`<div class="m">As-built <b>${esc(r.asb)}</b></div>`:`<div class="warn">No as-built date — generated from submittal, not verified in field</div>`}</div>
  <div class="search"><input id="q" type="search" placeholder="Find a point, channel, cable, terminal…" autocomplete="off"><div class="hint" id="hint"></div></div>
  <h2>Network<span>Controllers</span></h2><div class="ctl">${ctls}</div>
  <h2>Tap a point for screw-by-screw wiring<span>Points</span></h2>${devs}
  <div class="foot">Tag format v${esc(r.v||1)} · ${(r.pts||[]).length} points</div>`;
  const items=[...document.querySelectorAll('.s')];
  $('#q').addEventListener('input',e=>{const q=e.target.value.trim().toLowerCase();let n=0;
    items.forEach(el=>{const hit=q&&el.dataset.k.toLowerCase().includes(q);el.classList.toggle('hit',hit);el.classList.toggle('dim',!!q&&!hit);if(hit)n++});
    $('#hint').textContent=q?(n?`${n} match${n>1?'es':''}`:'No matches'):'';
    if(q&&n){const f=items.find(el=>el.classList.contains('hit'));f&&f.scrollIntoView({block:'center'})}});
  document.querySelectorAll('.pt').forEach(el=>el.onclick=()=>openSheet(r,+el.dataset.i));
  window.scrollTo(0,0);
}
$('#home').onclick=home;

// ---------- wiring sheet ----------
function wiringSVG(p,t,ch){
  const n=t.screws.length,rowH=34,H=40+n*rowH,W=360;
  let s=`<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica,Arial,sans-serif">`;
  s+=`<rect x="8" y="8" width="112" height="${H-16}" rx="6" fill="#EAEFEA" stroke="#111512" stroke-width="1.5"/>`;
  s+=`<text x="64" y="26" text-anchor="middle" font-size="11" fill="#5B655C">${esc(p[0])}</text>`;
  s+=`<rect x="${W-120}" y="8" width="112" height="${H-16}" rx="6" fill="#fff" stroke="#111512" stroke-width="1.5"/>`;
  s+=`<text x="${W-64}" y="26" text-anchor="middle" font-size="11" fill="#5B655C">${esc(t.single?(p[6]||'device'):(p[6]||'lands at'))}</text>`;
  t.screws.forEach((sc,i)=>{const y=44+i*rowH;const lbl=/^[+−]$/.test(sc[0])?ch+' '+sc[0]:sc[0];const land=t.single?(p[5]&&p[5][0])||'':(p[5]&&p[5][i])||'';
    s+=`<rect x="16" y="${y-11}" width="96" height="22" rx="3" fill="#fff" stroke="#CFD6D0"/><text x="64" y="${y+4}" text-anchor="middle" font-size="12" font-weight="700" fill="#111512">${esc(lbl)}</text>`;
        s+=`<line x1="112" y1="${y}" x2="${W-120}" y2="${y}" stroke="#111512" stroke-width="2.5" stroke-linecap="round"/>`;
    s+=`<text x="${W/2}" y="${y-7}" text-anchor="middle" font-size="10" fill="#5B655C">${esc(sc[2])}</text>`;
    if(sc[1]==='feed')s+=`<text x="${W/2}" y="${y+16}" text-anchor="middle" font-size="10" font-weight="700" fill="#7A5300">supply →</text>`;
    if(sc[1]==='sw')s+=`<text x="${W/2}" y="${y+16}" text-anchor="middle" font-size="10" font-weight="700" fill="#7A5300">→ to load</text>`;
    s+=`<rect x="${W-112}" y="${y-11}" width="96" height="22" rx="3" fill="#EAEFEA" stroke="#CFD6D0"/><text x="${W-64}" y="${y+4}" text-anchor="middle" font-size="12" font-weight="700" fill="#111512">${esc(land)}</text>`;});
  if(t.dry&&n===2){s+=`<path d="M 106 ${44+rowH/2-9} l 0 -7 M 106 ${44+rowH/2+9} l 0 7" stroke="#111512" stroke-width="1.5"/><path d="M 106 ${44+rowH/2-9} l 10 14" stroke="#111512" stroke-width="1.5"/><circle cx="106" cy="${44+rowH/2-9}" r="2" fill="#111512"/><circle cx="106" cy="${44+rowH/2+9}" r="2" fill="#111512"/>`}
  return s+'</svg>';
}
function openSheet(r,i){
  const p=r.pts[i],t=TPL[p[3]]||TPL.TH,ch=p[1];
  const rows=t.screws.map((sc,j)=>{const lbl=/^[+−]$/.test(sc[0])?ch+' '+sc[0]:sc[0];const land=t.single?(p[5]&&p[5][0])||'':(p[5]&&p[5][j])||'';
    return `<span class="sc">${esc(lbl)}</span><span class="ld"><b>→ ${esc(land||'at controller')}</b><small>${esc(sc[2])}</small></span>`}).join('');
  $('#pn').innerHTML=`<div class="grab"></div><h3>${esc(p[2])}</h3><div class="sub">${esc(p[0])} · ${esc(ch)} · ${esc(TYPES[p[3]]||p[3])}${p[4]?' · '+esc(p[4]):''}${p[6]?' · '+esc(p[6]):''}</div>
   ${wiringSVG(p,t,ch)}<div class="wl">${rows}</div>
   ${t.dry?`<div class="dry"><b>Dry contact — this output supplies no voltage.</b>${t.dry}</div>`:''}
   ${t.tip?`<div class="tip">${t.tip}</div>`:''}${p[7]?`<div class="tip"><b>Drawing note:</b> ${esc(p[7])}</div>`:''}
   <button class="close" id="cls">Close</button>`;
  $('#sheet').classList.add('on');$('#cls').onclick=closeSheet;
}
function closeSheet(){$('#sheet').classList.remove('on')}
$('#sheet').addEventListener('click',e=>{if(e.target.id==='sheet')closeSheet()});
addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet()});

// ---------- boot ----------
(async()=>{
  if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
  if(location.hash.length>1){try{show(await decodePayload(location.hash));return}catch(e){home();err(e.message);return}}
  home();
})();
addEventListener('hashchange',async()=>{if(location.hash.length>1){try{show(await decodePayload(location.hash))}catch(e){home();err(e.message)}}});
</script>
